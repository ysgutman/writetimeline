<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안샘의 도덕윤리 배움 기록장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 네비게이션 바 -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-feather-pointed text-lg"></i>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-600 to-orange-600 bg-clip-text text-transparent">
                    글쓰기 타임라인 SNS
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <div id="db-status-badge" class="px-3 py-1.5 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-xl border border-emerald-200 flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="db-status-text">Firebase 연동중</span>
                </div>
                <button id="refresh-btn" class="p-2.5 text-slate-600 hover:text-amber-600 hover:bg-amber-50 rounded-xl transition" title="새로고침">
                    <i class="fa-solid fa-rotate-right text-lg"></i>
                </button>
                <button id="open-post-modal" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 rounded-xl font-medium shadow-md hover:shadow-amber-200 hover:shadow-lg transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>포스트 작성</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6">
        
        <!-- 토스트 메시지 영역 -->
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

        <!-- 피드 헤더 및 카운트 -->
        <div class="flex items-center justify-between mb-4 px-2">
            <div class="text-sm font-medium text-slate-500">
                실시간 타임라인 피드 (<span id="total-posts-count">0</span>개의 글)
            </div>
            <div class="text-xs text-slate-400 flex items-center space-x-1">
                <i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i>
                <span>Firestore (moral-board2026) 연동됨</span>
            </div>
        </div>

        <!-- 피드 목록 영역 -->
        <div id="posts-container" class="space-y-4">
            <!-- 동적 포스트 카드 -->
        </div>

        <!-- 빈 상태 표시 -->
        <div id="empty-state" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm mt-4">
            <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-comment-slash"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-700">작성된 글이 없습니다</h3>
            <p class="text-sm text-slate-400 mt-1">오른쪽 위 '+ 포스트 작성' 버튼을 눌러 첫 번째 이야기를 남겨보세요!</p>
        </div>

        <!-- 로딩 스피너 -->
        <div id="loading-spinner" class="text-center py-16">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500"></i>
            <p class="text-sm text-slate-500 mt-2">Firebase에서 데이터를 불러오는 중입니다...</p>
        </div>

        <!-- 페이지네이션 영역 -->
        <div id="pagination-container" class="mt-8 flex justify-center items-center space-x-2">
            <!-- 페이지 번호 -->
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
        <p>안샘의 도덕윤리 수업 수강 학생들을 위한 '배움기록장' &copy; 2026. All rights reserved.</p>
    </footer>

    <!-- ================= MODALS ================= -->

    <!-- 1. 포스트 작성/수정 모달 -->
    <div id="post-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden border border-slate-100 transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">새 포스트 작성</h3>
                <button id="close-post-modal" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="post-form" class="p-6 space-y-4">
                <input type="hidden" id="edit-post-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">작성자 이름</label>
                    <input type="text" id="post-name" required placeholder="예: 1712 김민준" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">내용</label>
                    <textarea id="post-content" required rows="4" placeholder="친구들에게 나누고 싶은 이야기를 적어보세요..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">비밀번호 (숫자 4자리)</label>
                    <input type="password" id="post-password" required maxlength="4" pattern="[0-9]{4}" placeholder="비밀번호 4자리 입력" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm tracking-widest">
                    <p class="text-xs text-slate-400 mt-1">글을 수정하거나 삭제할 때 필요합니다.</p>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" id="cancel-post-btn" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm font-medium transition">취소</button>
                    <button type="submit" id="submit-post-btn" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium shadow-md shadow-amber-200 transition">게시하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 비밀번호 확인 모달 (수정/삭제용) -->
    <div id="password-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden border border-slate-100">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 id="pwd-modal-title" class="font-bold text-base text-slate-800">비밀번호 확인</h3>
                <button id="close-pwd-modal" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="pwd-form" class="p-6 space-y-4">
                <input type="hidden" id="pwd-action-type">
                <input type="hidden" id="pwd-target-id">
                <p class="text-xs text-slate-500" id="pwd-desc">작성 시 입력했던 4자리 숫자를 입력해주세요.</p>
                <div>
                    <input type="password" id="verify-password" required maxlength="4" pattern="[0-9]{4}" placeholder="비밀번호 4자리" class="w-full px-4 py-2.5 text-center tracking-widest rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-lg font-bold">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" id="cancel-pwd-btn" class="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm font-medium transition">취소</button>
                    <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium shadow-md transition">확인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= FIREBASE & APP JAVASCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // 제공받은 Firebase 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyBkSgHUkfZ5B2MXkRkaa1OAU_mcQE74s5Y",
            authDomain: "moral-board2026.firebaseapp.com",
            projectId: "moral-board2026",
            storageBucket: "moral-board2026.firebasestorage.app",
            messagingSenderId: "113125321045",
            appId: "1:113125321045:web:0ecf9c091994596bd9e7dc",
            measurementId: "G-ZRVYDDE2T9"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 상태 변수
        let posts = [];
        let currentPage = 1;
        const postsPerPage = 10;

        // DOM 요소
        const postsContainer = document.getElementById('posts-container');
        const emptyState = document.getElementById('empty-state');
        const loadingSpinner = document.getElementById('loading-spinner');
        const paginationContainer = document.getElementById('pagination-container');
        const totalPostsCount = document.getElementById('total-posts-count');

        window.addEventListener('DOMContentLoaded', () => {
            loadPostsFromFirestore();
            setupEventListeners();
        });

        // 토스트 알림 함수
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-900 text-white' : 'bg-rose-600 text-white';
            toast.className = `${bgColor} px-4 py-3 rounded-xl shadow-xl text-xs font-medium transform transition-all duration-300 translate-y-2 opacity-0 flex items-center space-x-2`;
            
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-exclamation text-rose-200"></i>';
            toast.innerHTML = `${icon}<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // 이벤트 리스너 설정
        function setupEventListeners() {
            document.getElementById('refresh-btn').addEventListener('click', () => {
                loadPostsFromFirestore();
                showToast('최신 글을 새로고침했습니다.');
            });

            document.getElementById('open-post-modal').addEventListener('click', () => openPostModal());
            document.getElementById('close-post-modal').addEventListener('click', () => closePostModal());
            document.getElementById('cancel-post-btn').addEventListener('click', () => closePostModal());

            document.getElementById('post-form').addEventListener('submit', handlePostSubmit);

            document.getElementById('close-pwd-modal').addEventListener('click', () => closePwdModal());
            document.getElementById('cancel-pwd-btn').addEventListener('click', () => closePwdModal());
            document.getElementById('pwd-form').addEventListener('submit', handlePasswordVerify);
        }

        function showLoading(show) {
            if (show) {
                loadingSpinner.classList.remove('hidden');
                postsContainer.innerHTML = '';
                emptyState.classList.add('hidden');
            } else {
                loadingSpinner.classList.add('hidden');
            }
        }

        // Firestore에서 게시물 불러오기 (최신글 우선 정렬)
        async function loadPostsFromFirestore() {
            showLoading(true);
            try {
                const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                const loaded = [];
                querySnapshot.forEach((docSnap) => {
                    loaded.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts = loaded;
            } catch (err) {
                console.error("Firestore 로드 오류:", err);
                // 만약 createdAt 인덱스가 아직 생성되지 않은 경우 전체 조회 후 클라이언트 정렬 시도
                try {
                    const fallbackSnapshot = await getDocs(collection(db, 'posts'));
                    const loaded = [];
                    fallbackSnapshot.forEach((docSnap) => {
                        loaded.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    loaded.sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt || 0).getTime();
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : new Date(b.createdAt || 0).getTime();
                        return timeB - timeA;
                    });
                    posts = loaded;
                } catch (fallbackErr) {
                    console.error("폴백 로드 오류:", fallbackErr);
                    showToast("데이터를 불러오지 못했습니다.", "error");
                }
            } finally {
                showLoading(false);
                renderFeed();
            }
        }

        // 피드 렌더링 및 페이지네이션
        window.renderFeed = function() {
            totalPostsCount.textContent = posts.length;

            if (posts.length === 0) {
                emptyState.classList.remove('hidden');
                postsContainer.innerHTML = '';
                paginationContainer.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');

            const totalPages = Math.ceil(posts.length / postsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * postsPerPage;
            const endIndex = startIndex + postsPerPage;
            const currentPosts = posts.slice(startIndex, endIndex);

            const colors = ['bg-amber-500', 'bg-orange-500', 'bg-emerald-500', 'bg-sky-500', 'bg-violet-500', 'bg-rose-500'];

            postsContainer.innerHTML = currentPosts.map((post, idx) => {
                const colorClass = colors[idx % colors.length];
                const initial = post.name ? post.name.charAt(0) : '학';
                const dateStr = formatTimestamp(post.createdAt);

                return `
                    <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm hover:shadow-md transition duration-200 relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-1.5 h-full ${colorClass}"></div>
                        
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full ${colorClass} text-white font-bold flex items-center justify-center shadow-sm">
                                    ${initial}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                                        <span>${escapeHtml(post.name)}</span>
                                        <span class="text-[11px] font-normal px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">학생</span>
                                    </h4>
                                    <p class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${dateStr}</p>
                                </div>
                            </div>
                            
                            <div class="flex items-center space-x-1 opacity-80 group-hover:opacity-100 transition">
                                <button onclick="window.openPwdModalForAction('edit', '${post.id}')" class="px-2.5 py-1 text-xs text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition" title="수정">
                                    <i class="fa-solid fa-pen mr-1"></i>수정
                                </button>
                                <button onclick="window.openPwdModalForAction('delete', '${post.id}')" class="px-2.5 py-1 text-xs text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="삭제">
                                    <i class="fa-solid fa-trash mr-1"></i>삭제
                                </button>
                            </div>
                        </div>

                        <div class="mt-4 text-slate-700 text-sm leading-relaxed whitespace-pre-wrap pl-1">
                            ${escapeHtml(post.content)}
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <button onclick="window.handleLike('${post.id}')" class="flex items-center space-x-1.5 text-slate-500 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 px-3 py-1.5 rounded-xl transition text-xs font-semibold group/btn">
                                <i class="fa-solid fa-heart text-rose-400 group-hover/btn:scale-110 transition"></i>
                                <span>좋아요</span>
                                <span class="bg-slate-200 text-slate-700 px-1.5 py-0.2 rounded-full text-[10px] ml-1">${post.likes || 0}</span>
                            </button>
                            <span class="text-[11px] text-slate-300">ID: ${post.id.slice(0, 8)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        };

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button onclick="window.changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">이전</button>`;

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'bg-amber-500 text-white font-bold shadow-sm' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-100';
                html += `<button onclick="window.changePage(${i})" class="w-8 h-8 rounded-xl text-xs flex items-center justify-center transition ${activeClass}">${i}</button>`;
            }

            html += `<button onclick="window.changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">다음</button>`;

            paginationContainer.innerHTML = html;
        }

        window.changePage = function(page) {
            const totalPages = Math.ceil(posts.length / postsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function formatTimestamp(ts) {
            if (!ts) return '방금 전';
            let d;
            if (ts.toDate) {
                d = ts.toDate();
            } else if (ts.seconds) {
                d = new Date(ts.seconds * 1000);
            } else {
                d = new Date(ts);
            }
            if (isNaN(d.getTime())) return '방금 전';
            
            const now = new Date();
            const diffSec = Math.floor((now - d) / 1000);
            if (diffSec < 60) return '방금 전';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}분 전`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}시간 전`;
            
            return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // 모달 제어
        window.openPostModal = function(editPost = null) {
            const modal = document.getElementById('post-modal');
            const title = document.getElementById('modal-title');
            const submitBtn = document.getElementById('submit-post-btn');
            
            document.getElementById('post-form').reset();
            document.getElementById('edit-post-id').value = '';

            if (editPost) {
                title.textContent = '포스트 수정';
                submitBtn.textContent = '수정완료';
                document.getElementById('edit-post-id').value = editPost.id;
                document.getElementById('post-name').value = editPost.name;
                document.getElementById('post-content').value = editPost.content;
                document.getElementById('post-password').value = editPost.password;
            } else {
                title.textContent = '새 포스트 작성';
                submitBtn.textContent = '게시하기';
            }
            modal.classList.remove('hidden');
        };

        function closePostModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        // 포스트 작성/수정 핸들러
        async function handlePostSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-post-id').value;
            const name = document.getElementById('post-name').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const password = document.getElementById('post-password').value.trim();

            if (!/^[0-9]{4}$/.test(password)) {
                showToast('비밀번호는 반드시 숫자 4자리여야 합니다.', 'error');
                return;
            }

            try {
                if (editId) {
                    const postRef = doc(db, 'posts', editId);
                    await updateDoc(postRef, { name, content });
                    showToast('포스트가 수정되었습니다.');
                } else {
                    const newPostData = {
                        name,
                        content,
                        password,
                        likes: 0,
                        createdAt: serverTimestamp()
                    };
                    await addDoc(collection(db, 'posts'), newPostData);
                    showToast('성공적으로 게시되었습니다!');
                    currentPage = 1;
                }

                closePostModal();
                await loadPostsFromFirestore();
            } catch (err) {
                console.error("저장 오류:", err);
                showToast('저장 중 오류가 발생했습니다.', 'error');
            }
        }

        // 좋아요 기능
        window.handleLike = async function(id) {
            try {
                const target = posts.find(p => p.id === id);
                if (!target) return;
                const newLikes = (target.likes || 0) + 1;

                const postRef = doc(db, 'posts', id);
                await updateDoc(postRef, { likes: newLikes });

                target.likes = newLikes;
                renderFeed();
                showToast('❤️ 좋아요를 눌렀습니다!');
            } catch (err) {
                console.error("좋아요 오류:", err);
                showToast('좋아요 반영 실패', 'error');
            }
        };

        // 비밀번호 확인 모달
        window.openPwdModalForAction = function(action, id) {
            document.getElementById('pwd-action-type').value = action;
            document.getElementById('pwd-target-id').value = id;
            document.getElementById('verify-password').value = '';
            document.getElementById('pwd-modal-title').textContent = action === 'edit' ? '글 수정 - 비밀번호 확인' : '글 삭제 - 비밀번호 확인';
            document.getElementById('pwd-desc').textContent = action === 'edit' ? '수정하려면 작성 시 입력한 4자리 비밀번호를 입력하세요.' : '삭제하려면 작성 시 입력한 4자리 비밀번호를 입력하세요.';
            document.getElementById('password-modal').classList.remove('hidden');
        };

        function closePwdModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        async function handlePasswordVerify(e) {
            e.preventDefault();
            const action = document.getElementById('pwd-action-type').value;
            const targetId = document.getElementById('pwd-target-id').value;
            const inputPwd = document.getElementById('verify-password').value.trim();

            const targetPost = posts.find(p => p.id === targetId);
            if (!targetPost) {
                showToast('포스트를 찾을 수 없습니다.', 'error');
                closePwdModal();
                return;
            }

            if (targetPost.password !== inputPwd) {
                showToast('비밀번호가 일치하지 않습니다!', 'error');
                return;
            }

            closePwdModal();

            if (action === 'edit') {
                openPostModal(targetPost);
            } else if (action === 'delete') {
                if (confirm('정말 이 글을 삭제하시겠습니까?')) {
                    try {
                        await deleteDoc(doc(db, 'posts', targetId));
                        showToast('포스트가 삭제되었습니다.');
                        await loadPostsFromFirestore();
                    } catch (err) {
                        console.error("삭제 오류:", err);
                        showToast('삭제 중 오류가 발생했습니다.', 'error');
                    }
                }
            }
        }
    </script>
</body>
</html>
